[project]
name = "buscador-osint"
version = "0.1.0"
license = "MIT"
description = "Back-end do MVP do buscador OSINT (TCC2, UnB/FCTE): coleta passiva de dados abertos, resolução de entidades, grafo de vínculos, tipologias, cadeia de custódia e auditoria"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "networkx>=3.3",
    "psycopg[binary]>=3.2",
    "python-dotenv>=1.0",
    "argon2-cffi>=23.1",
    "cryptography>=43",
    "pypdf>=5.0",
]

[dependency-groups]
dev = [
    "bandit>=1.8",
    "pytest>=8.2",
    "ruff>=0.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning:fastapi.testclient", "ignore::DeprecationWarning:starlette.testclient"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
# B008: `Depends(...)` em argumento padrão é o idioma do FastAPI.
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# Nos testes do horizonte 3, uma asserção por linha lê melhor do que a quebra forçada.
"tests/test_horizonte3.py" = ["E501"]

# Análise estática de segurança (RNF11, H16): `uv run bandit -c pyproject.toml -r buscador scripts`.
# Os testes ficam de fora: usam `assert` e tokens sintéticos de propósito. Não há regra desligada;
# cada supressão é pontual (`# nosec BXXX`) e vem com a justificativa no comentário ao lado.
[tool.bandit]
exclude_dirs = ["tests", ".venv"]

[tool.uv]
package = false
